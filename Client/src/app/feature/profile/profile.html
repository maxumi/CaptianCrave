<div class="profile-page">
  <div class="profile-card">
    <h2>Profile</h2>

    <div class="profile-info">
      <p><strong>Name:</strong> {{ name() }}</p>
      <p><strong>Address:</strong> {{ address() }}</p>
    </div>

    <label for="address">Change address</label>

    <input
      id="address"
      class="form-input"
      type="text"
      placeholder="Enter new address"
      [ngModel]="addressInput()"
      (ngModelChange)="addressInput.set($event)"
    />

    <button class="form-button" type="button" (click)="saveAddress()">
      Save address
    </button>

    @if (saveError()) {
      <p class="profile-state profile-state-error">{{ saveError() }}</p>
    }

    @if (saveSuccess()) {
      <p class="profile-state profile-state-success">{{ saveSuccess() }}</p>
    }

    <div id="profile-map"></div>
  </div>
</div>
